<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physio Works! Home Exercise Program</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F0F4F6;
      background-image: linear-gradient(180deg, #E8EFF2 0%, #F4F8FA 100%);
      background-attachment: fixed;
      color: #1A2C3F;
    }
    .clinic-header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, #F6F8FA 0%, #DEE3EB 28%, #495B7F 55%, #152850 82%, #11224A 100%);
      border-bottom: 3px solid #B61328;
      box-shadow: 0 8px 24px rgba(17, 34, 74, 0.12);
    }
    .speed-lines {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 100%;
      pointer-events: none;
    }
    .brand-mark {
      display: inline-block;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: 1.2rem;
      line-height: 1.1;
      background: linear-gradient(100deg, #11224A 0%, #1D354E 40%, #D22D3B 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .brand-sub { color: #5E7182; font-size: 11px; font-weight: 600; }
    .header-tool {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(17, 34, 74, 0.12);
      border-radius: 10px;
      color: #5E7182;
    }
    .surface-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      box-shadow: none;
    }
    .notes-box {
      background: rgba(235, 240, 243, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-left: 2px solid #D22D3B;
      color: #1A2C3F;
      border-radius: 8px;
    }
    .frost-chip, .badge-selected {
      background: rgba(202, 211, 214, 0.35);
      color: #1D354E;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 9999px;
    }
    .clinic-header .badge-selected {
      background: rgba(240, 244, 246, 0.94);
      color: #1D354E;
    }
    .btn-signal {
      background: #D22D3B;
      color: #fff;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn-signal:hover { background: #B82330; }
    .diagram-frame {
      background: #fff;
      border: 1px solid rgba(29, 53, 78, 0.16);
      border-radius: 8px;
    }
    .dose-panel {
      background: rgba(235, 240, 243, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 10px;
    }
    .done-check {
      appearance: none;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 4px;
      border: 1px solid #CAD3D6;
      background: linear-gradient(180deg, #ffffff, #E2E8EB);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      display: grid;
      place-content: center;
    }
    .done-check:checked {
      background: #1D354E;
      border-color: #1D354E;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .done-check:checked::after {
      content: "";
      width: 0.32rem;
      height: 0.55rem;
      border: solid #CAD3D6;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .done-check:focus-visible { outline: 2px solid #1D354E; outline-offset: 2px; }
    @media print {
      body, .clinic-header, .surface-card, .notes-box, .dose-panel, .frost-chip, .header-tool {
        background: #fff !important;
        background-image: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        color: #000 !important;
      }
      .clinic-header { border-bottom: 1px solid #000 !important; }
      .brand-mark {
        background: none !important;
        -webkit-text-fill-color: #000 !important;
        color: #000 !important;
      }
      .brand-sub { color: #000 !important; }
      .speed-lines { display: none !important; }
    }
  </style>
</head>
<body class="text-[#1A2C3F] min-h-screen pb-12">

  <!-- Mobile-Friendly Header -->
  <header class="clinic-header sticky top-0 z-30">
    <svg class="speed-lines" viewBox="0 0 280 72" aria-hidden="true">
      <path d="M-8 16 C 48 6, 96 30, 168 12" fill="none" stroke="rgba(73, 91, 127, 0.25)" stroke-width="1.6"/>
      <path d="M-8 30 C 58 20, 118 44, 198 24" fill="none" stroke="rgba(73, 91, 127, 0.25)" stroke-width="1.3"/>
      <path d="M-8 46 C 70 36, 130 56, 220 38" fill="none" stroke="rgba(73, 91, 127, 0.25)" stroke-width="1.1"/>
    </svg>
    <div class="relative max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div>
        <span class="brand-mark">PhysioWorks</span>
        <p class="brand-sub" id="headerLocation">Physical Therapy</p>
      </div>
      <div class="header-tool text-right px-2.5 py-1">
        <span class="text-[10px] uppercase font-bold block tracking-wider">Access Code</span>
        <span id="displayAccessCode" class="text-xs font-mono font-bold text-[#11224A]">PW-VIEW</span>
      </div>
    </div>
  </header>

  <!-- Main Patient Content Container -->
  <main class="max-w-2xl mx-auto px-4 py-6 space-y-5">

    <!-- Manual Code Lookup Box -->
    <div id="codeEntryCard" class="surface-card p-5 text-center space-y-3">
      <h2 class="text-sm font-bold text-[#1D354E]">Enter Your Access Code</h2>
      <p class="text-xs text-[#1A2C3F]">Find the 6-character code printed at the top of your exercise handout.</p>
      <div class="flex max-w-xs mx-auto space-x-2">
        <input type="text" id="manualCodeInput" placeholder="PW-XXXX" 
               class="flex-1 px-3 py-2 text-center text-sm font-mono font-bold uppercase bg-white border border-[#B8C5CB] rounded-lg text-[#1A2C3F] focus:outline-none focus:ring-2 focus:ring-[#1D354E]">
        <button onclick="submitManualCode()" class="btn-signal px-4 py-2 text-xs rounded-lg transition shadow-sm">
          View
        </button>
      </div>
    </div>

    <!-- Active Program Display Card -->
    <div id="programHeaderCard" class="hidden surface-card p-5 space-y-3">
      <div class="border-b border-[#E2E8EB] pb-3">
        <span class="badge-selected text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">Prescription Routine</span>
        <h2 id="programTitle" class="text-lg font-black text-[#1D354E] mt-1">Rehabilitation Program</h2>
      </div>
      <div class="notes-box rounded-xl p-3.5 space-y-1">
        <span class="text-xs font-bold text-[#1D354E] flex items-center space-x-1">
          <span>💬</span>
          <span>Therapist Instructions</span>
        </span>
        <p id="therapistNotes" class="text-xs text-[#1A2C3F] leading-relaxed font-medium">Perform within pain-free tolerance.</p>
      </div>
    </div>

    <!-- Clinical Directives Banner -->
    <div id="clinicalDirectivesBanner" class="notes-box hidden rounded-2xl p-4 space-y-2">
      <h2 class="text-sm font-black text-[#1D354E] uppercase tracking-wide">Clinical Precautions & Care Instructions</h2>
      <ul id="clinicalDirectivesList" class="space-y-2"></ul>
    </div>

    <!-- Exercise Cards Container -->
    <div id="exerciseCardsList" class="space-y-4">
      <!-- Populated dynamically via JS -->
    </div>

  </main>

  <script>
    function codeFromLocation() {
      const queryCode = new URLSearchParams(window.location.search).get("code");
      if (queryCode && queryCode.trim()) return queryCode.trim().toUpperCase();
      const hash = window.location.hash.replace(/^#/, "").trim();
      if (!hash) return "";
      if (hash.includes("=")) {
        const hashedCode = new URLSearchParams(hash).get("code");
        return hashedCode && hashedCode.trim() ? hashedCode.trim().toUpperCase() : "";
      }
      return hash.toUpperCase();
    }

    function decodeSharePayload(encoded) {
      const normalized = String(encoded).replace(/-/g, "+").replace(/_/g, "/");
      const padLength = (4 - (normalized.length % 4)) % 4;
      const padded = normalized + "=".repeat(padLength);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    async function programFromPayload(payload) {
      let catalog = [];
      try {
        const response = await fetch("./exercises.json");
        if (response.ok) catalog = await response.json();
      } catch (error) {
        catalog = [];
      }
      const byId = new Map(catalog.map(item => [item.id, item]));
      const exercises = (payload.exercises || []).map((item, index) => {
        const template = byId.get(item.id) || {};
        const dosing = template.default_dosing || {};
        return {
          uniqueInstanceId: "shared_" + index,
          baseId: item.id || "custom",
          name: template.name || item.name || "Exercise",
          type: template.type || "strength",
          side: item.side || "Bilateral",
          sets: item.sets,
          reps: item.reps,
          hold: item.hold,
          freq: item.freq || dosing.frequency || "",
          cues: template.cues || [],
          photos: template.photos || []
        };
      });
      return {
        code: String(payload.code || "").toUpperCase(),
        clinic: payload.clinic || "Silverdale",
        title: payload.title || "",
        notes: payload.notes || "",
        directives: Array.isArray(payload.directives) ? payload.directives : [],
        exercises,
        savedAt: new Date().toISOString()
      };
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const encoded = hashParams.get("d");
      if (encoded) {
        try {
          const payload = decodeSharePayload(encoded);
          const program = await programFromPayload(payload);
          if (!program.code) program.code = codeFromLocation();
          if (program.code) localStorage.setItem("PW_HEP_" + program.code, JSON.stringify(program));
          renderProgram(program);
          return;
        } catch (error) {
          console.error(error);
        }
      }
      const codeFromUrl = codeFromLocation();
      if (codeFromUrl) loadProgram(codeFromUrl);
    });

    function submitManualCode() {
      const code = document.getElementById("manualCodeInput").value.trim().toUpperCase();
      if (!code) {
        alert("Please enter a valid code.");
        return;
      }
      loadProgram(code.startsWith("PW-") ? code : "PW-" + code);
    }

    function formatHold(hold) {
      const raw = String(hold ?? "").trim();
      if (!raw) return "";
      if (/[a-z]/i.test(raw)) return raw;
      return raw + "s";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function photoSlots(photos) {
      const list = (photos || []).filter(Boolean);
      if (!list.length) return [];
      const [first, second] = list;
      const placeholder = src => String(src).includes("placehold.co");
      if (!second || second === first || (placeholder(first) && placeholder(second))) return [first];
      return [first, second];
    }

    function photoFitClass(src) {
      const value = String(src);
      if (value.includes("image/svg") || value.startsWith("assets/") || value.includes("placehold.co")) {
        return "object-contain bg-white";
      }
      return "object-cover";
    }

    function loadProgram(code) {
      const raw = localStorage.getItem("PW_HEP_" + code);
      if (!raw) {
        alert("No exercise program found for code: " + code);
        return;
      }
      renderProgram(JSON.parse(raw));
    }

    function renderProgram(program) {
      document.getElementById("codeEntryCard").classList.add("hidden");
      document.getElementById("programHeaderCard").classList.remove("hidden");

      document.getElementById("displayAccessCode").textContent = program.code;
      document.getElementById("headerLocation").textContent = `${program.clinic || 'Silverdale'} Clinic`;
      document.getElementById("programTitle").textContent = program.title || "Home Rehabilitation Routine";
      document.getElementById("therapistNotes").textContent = program.notes || "Perform daily within comfortable tolerance.";

      const directives = Array.isArray(program.directives) ? program.directives.filter(Boolean) : [];
      const directiveBanner = document.getElementById("clinicalDirectivesBanner");
      const directiveList = document.getElementById("clinicalDirectivesList");
      directiveList.innerHTML = "";
      if (directives.length > 0) {
        directives.forEach(directive => {
          const match = String(directive).match(/^(\S+)\s+([\s\S]+)$/);
          const icon = match ? match[1] : "⚠️";
          const text = match ? match[2] : String(directive);
          const item = document.createElement("li");
          item.className = "flex items-start gap-2 text-sm font-bold text-[#1A2C3F] leading-snug";
          item.innerHTML = `<span class="text-base leading-none">${escapeHtml(icon)}</span><span>${escapeHtml(text)}</span>`;
          directiveList.appendChild(item);
        });
        directiveBanner.classList.remove("hidden");
      } else {
        directiveBanner.classList.add("hidden");
      }

      const container = document.getElementById("exerciseCardsList");
      container.innerHTML = "";

      program.exercises.forEach((ex, idx) => {
        const slots = photoSlots(ex.photos);
        const card = document.createElement("div");
        card.className = "surface-card p-4 space-y-3";
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-[#E2E8EB] pb-2">
            <div class="flex items-center space-x-2">
              <span class="frost-chip w-6 h-6 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
              <h3 class="text-sm font-bold text-[#1D354E]">[${escapeHtml(ex.side)}] ${escapeHtml(ex.name)}</h3>
            </div>
            <label class="flex items-center space-x-1.5 cursor-pointer">
              <input type="checkbox" class="done-check" aria-label="Mark ${escapeHtml(ex.name)} done">
              <span class="text-xs text-[#1A2C3F] font-medium">Done</span>
            </label>
          </div>

          <div class="${slots.length === 1 ? "" : "grid grid-cols-2 gap-2"}">
            ${slots.map((src, slot) => `
            <div class="space-y-1">
              ${slots.length === 1 ? "" : `<span class="text-[10px] font-bold text-[#1D354E] uppercase tracking-wider block text-center">${slot === 0 ? "Start Position" : "Finish / Hold"}</span>`}
              <img src="${escapeHtml(src)}" alt="" class="diagram-frame w-full h-32 ${photoFitClass(src)}">
            </div>`).join("")}
          </div>

          <div class="dose-panel p-2.5 flex justify-around text-center">
            <div>
              <span class="text-[10px] font-bold text-[#1D354E] uppercase block">Sets</span>
              <span class="text-xs font-black text-[#1A2C3F]">${ex.sets}</span>
            </div>
            <div class="border-l border-[#B8C5CB] pl-3">
              <span class="text-[10px] font-bold text-[#1D354E] uppercase block">Reps</span>
              <span class="text-xs font-black text-[#1A2C3F]">${ex.reps}</span>
            </div>
            <div class="border-l border-[#B8C5CB] pl-3">
              <span class="text-[10px] font-bold text-[#1D354E] uppercase block">Hold</span>
              <span class="text-xs font-black text-[#1A2C3F]">${escapeHtml(formatHold(ex.hold))}</span>
            </div>
            <div class="border-l border-[#B8C5CB] pl-3">
              <span class="text-[10px] font-bold text-[#1D354E] uppercase block">Frequency</span>
              <span class="text-xs font-black text-[#1A2C3F]">${ex.freq}</span>
            </div>
          </div>

          <div class="pt-1">
            <span class="text-xs font-bold text-[#1D354E] block mb-1">Key Form Cues:</span>
            <ul class="text-xs text-[#1A2C3F] space-y-1 list-disc list-inside">
              ${(ex.cues || []).map(c => `<li>${escapeHtml(c)}</li>`).join('')}
            </ul>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
